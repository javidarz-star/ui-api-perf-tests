stages:
  - test-e2e
  - test-api
  - test-perf

playwright_e2e:
  stage: test-e2e
  # Official Playwright image comes with Node and all browser OS dependencies pre-installed
  image: mcr.microsoft.com/playwright:v1.62.1-noble
  timeout: 20m

  # Rules matching your triggers: Merge Requests, main branch pushes, Scheduled runs, and Manual UI runs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

  # Cache npm dependencies between runs for faster execution
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

  before_script:
    - npm ci --cache .npm --prefer-offline

  script:
    - echo "E2E_EMAIL is ${E2E_EMAIL}"
    - npm test

  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/

karate_api_tests:
  stage: test-api
  image: maven:3.9.6-eclipse-temurin-17
  variables:
    MAVEN_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8"
  script:
    - cd karate-tests
    - mvn clean test -Dtest=OsmTestRunner -DaccessToken=${API_TOKEN}
  artifacts:
    when: always
    paths:
      - karate-tests/target/karate-reports/

k6_perf_tests:
  stage: test-perf
  image:
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    - k6 run k6-tests/homepage-test.js